policies:
  - name: resource-limits-dev
    description: Enforce resource limits for development environment
    type: resource_limit
    level: error
    enabled: true
    environments:
      - dev
    rules:
      limits:
        max_cpu: 8
        max_memory_mb: 16384

  - name: resource-limits-prod
    description: Enforce stricter resource limits for production
    type: resource_limit
    level: error
    enabled: true
    environments:
      - prod
    rules:
      limits:
        max_cpu: 16
        max_memory_mb: 32768

  - name: naming-conventions
    description: Enforce naming conventions for all resources
    type: naming_convention
    level: warning
    enabled: true
    rules:
      patterns:
        # All resources must use kebab-case with environment suffix
        "*": "^[a-z0-9]+(-[a-z0-9]+)*-[0-9]{2}$"
        # VMs must start with their purpose
        "proxmox:vm": "^(web|db|app|test|docker|opnsense|tailscale)-.*-[0-9]{2}$"

  - name: required-tags
    description: Require specific tags on all resources
    type: required_tags
    level: warning
    enabled: true
    rules:
      tags:
        - homelab
        - managed-by-infrafoundry

  - name: allowed-providers-prod
    description: Restrict providers in production
    type: allowed_providers
    level: error
    enabled: true
    environments:
      - prod
    rules:
      allowed:
        - proxmox
        - kubernetes
