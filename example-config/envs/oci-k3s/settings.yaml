# OCI k3s Cluster Environment Settings
#
# This example environment consumes the oci-k3s-cluster blueprint. The
# actual deployment logic lives in blueprints/oci-k3s-cluster/ and the
# per-tenancy values live in k3s-cluster/infrafoundry.yml.
#
# SECURITY NOTE: Encrypt with SOPS before committing:
#   sops --encrypt --in-place envs/oci-k3s/settings.yaml

name: oci-k3s
description: "OCI ARM Always-Free-Tier k3s cluster (example consumer of oci-k3s-cluster blueprint)"

variables:
  environment: oci-k3s
  managed_by: infrafoundry

ssh:
  user: ubuntu
  key_path: ~/.ssh/id_rsa

provider_settings:
  oci:
    # Get these from OCI Console -> Identity -> Users -> API Keys
    tenancy_ocid: "ocid1.tenancy.oc1..aaaaaaaxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    user_ocid: "ocid1.user.oc1..aaaaaaaxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    fingerprint: "aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99"
    private_key_path: "~/.oci/oci_api_key.pem"
    region: "us-ashburn-1"
    # Create a compartment or use root compartment OCID
    compartment_ocid: "ocid1.compartment.oc1..aaaaaaaxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Secrets for cloud-init and lifecycle scripts.
# Two delivery paths:
#   - tailscale.oauth_client_{id,secret} → flow into Terraform via the
#     framework's secrets→TF_VAR_* bridge (issue #212). Values never land
#     in generated/*.tf files.
#   - tailscale.api_key → consumed by the before_destroy event handler
#     env: block via {{ secrets.tailscale.api_key }} templating.
secrets:
  tailscale:
    # OAuth client credentials for the official tailscale/cloudinit/tailscale
    # Terraform module. Generate at:
    #   https://login.tailscale.com/admin/settings/oauth
    # Required scope: Devices Core (read+write).
    oauth_client_id: "tskey-client-XXXXXXXXXXXX"
    oauth_client_secret: "tskey-client-XXXXXXXXXXXX-secret"
    # API access token (Settings -> Keys -> API access tokens) for
    # the before_destroy Tailscale device cleanup script.
    api_key: "tskey-api-XXXXXXXXXXXX-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

# NOTE: lifecycle hooks (before_destroy tailscale cleanup, after_apply
# cluster verify) are owned by the oci-k3s-cluster blueprint's events:
# block. They move with the recipe so all consumers inherit them.
