# AIQUM (Active IQ Unified Manager) — example consumer of the aiqum blueprint.
#
# All deployment logic (VM definition, DHCP reservation, install scripts,
# event handlers) lives in blueprints/aiqum/. This file only supplies the
# per-instance values.
#
# See blueprints/aiqum/README.md for the full variable reference.
#
# Run: foundry infra apply --env dev --package aiqum

name: aiqum
description: "NetApp Active IQ Unified Manager (example)"
blueprint: aiqum

variables:
  # --- VM placement ---
  vm_name: aiqum
  vmid: 222
  target_node: pve1
  disk_storage: local-lvm

  # --- Network ---
  ip_address: "192.168.1.50"
  dhcp_subnet: my-subnet

  # --- AIQUM ---
  aiqum_admin_password: "CHANGE_ME"
  aiqum_admin_email: "admin@example.com"
  aiqum_url_base: "http://your-web-server/applications/aiqum"

  # --- SSH jumphost (for remote VM access during install) ---
  jumphost: "ansible@ansible.example.com"

  # --- SMTP (notifications) ---
  smtp_server: "smtp.example.com"
  smtp_user: "aiqum"
  smtp_password: "CHANGE_ME"

  # --- ONTAP cluster ---
  ontap_cluster_ip: "192.168.1.220"
  ontap_admin_password: "CHANGE_ME"
