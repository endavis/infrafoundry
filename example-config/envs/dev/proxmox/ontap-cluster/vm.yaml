      - bridge: {{ bridge }}
        model: e1000        # e0b — cluster interconnect
      - bridge: {{ bridge }}
        model: e1000        # e0c — management
{% if mgmt_vlan %}
        tag: {{ mgmt_vlan }}
{% endif %}
{% if node02_mgmt_mac %}
        macaddr: "{{ node02_mgmt_mac }}"
{% endif %}
      - bridge: {{ bridge }}
        model: e1000        # e0d — data
{% if mgmt_vlan %}
        tag: {{ mgmt_vlan }}
{% endif %}
{% if node02_data_mac %}
        macaddr: "{{ node02_data_mac }}"
{% endif %}
