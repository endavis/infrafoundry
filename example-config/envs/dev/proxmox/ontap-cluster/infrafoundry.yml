# ONTAP Simulator 2-node cluster — example consumer of the ontap-cluster blueprint.
#
# All deployment logic (VM definitions, DHCP reservations, Ansible playbooks,
# roles, event handler) lives in blueprints/ontap-cluster/. This file only
# supplies the per-instance values.
#
# See blueprints/ontap-cluster/README.md for the full variable reference.
#
# Run: foundry infra apply --env dev --package ontap-cluster

name: ontap-cluster
description: "NetApp ONTAP Simulator 2-node cluster (example)"
blueprint: ontap-cluster

variables:
  # --- Node identity ---
  node01_name: ontap-node-01
  node02_name: ontap-node-02
  node01_vmid: 220
  node02_vmid: 221
  node01_target: pve1
  node02_target: pve2

  # --- OVA source ---
  ova_source: "/path/to/vsim-netapp-DOT9.18.1-cm_nodar.ova"
  disk_storage: local-lvm

  # --- Proxmox hosts (for serial console access) ---
  pve1_host: "192.168.1.10"
  pve2_host: "192.168.1.11"

  # --- Cluster ---
  cluster_name: ontap-lab
  cluster_mgmt_ip: "192.168.1.220"
  cluster_mgmt_gateway: "192.168.1.1"
  node01_mgmt_ip: "192.168.1.221"
  node02_mgmt_ip: "192.168.1.222"
  node_mgmt_gateway: "192.168.1.1"
  ontap_password: "changeme123"
  dns_domain: "lab.local"

  # --- Data LIFs ---
  data_lif1_ip: "192.168.1.230"
  data_lif2_ip: "192.168.1.231"

  # --- CIFS ---
  cifs_server_name: ONTAPLAB

  # --- NFS Export Policy ---
  nfs_export_policy: nfs_data
  nfs_client_match: "192.168.1.0/24"

  # --- Volumes ---
  nfs_vol_name: NFS_VOL
  nfs_vol_aggregate: aggr1_node01
  cifs_vol_name: CIFS_VOL
  cifs_vol_aggregate: aggr1_node02

  # --- DNS & NTP ---
  dns_nameserver: "192.168.1.1"
  ntp_server: "192.168.1.1"

  # --- DHCP ---
  dhcp_subnet: my-subnet
  node01_ip: "192.168.1.221"
  node02_ip: "192.168.1.222"
