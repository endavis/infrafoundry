vms:
  - name: web-server-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 2
    sockets: 1
    memory: 4096
    disk:
      size: 50G
      type: scsi
      storage: local-lvm
    network:
      model: virtio
      bridge: vmbr0
      tag: 100
    ipconfig: ip=192.168.100.10/24,gw=192.168.100.1
    onboot: true
    agent: 1
    ssh_user: ubuntu
    tags:
      - webserver
      - nginx
      - development
    # Ansible roles to apply after VM creation
    ansible_roles:
      - common            # Base system configuration
      - webserver         # Nginx installation and configuration
      - docker            # Docker for containerized apps
      - monitoring-agent  # Prometheus node exporter
    # Optional: Custom Ansible variables for roles
    ansible_vars:
      webserver_port: 80
      webserver_ssl: true
      docker_users:
        - ubuntu

  - name: db-server-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 4
    sockets: 1
    memory: 8192
    disk:
      size: 100G
      type: scsi
      storage: local-lvm
    network:
      model: virtio
      bridge: vmbr0
      tag: 100
    ipconfig: ip=192.168.100.11/24,gw=192.168.100.1
    onboot: true
    agent: 1
    ssh_user: ubuntu
    tags:
      - database
      - postgresql
      - development
    # Ansible roles for database server
    ansible_roles:
      - common
      - database          # PostgreSQL installation
      - monitoring-agent
    # Inline Ansible tasks for custom configuration
    ansible_tasks:
      - name: Create application database
        module: postgresql_db
        params:
          name: appdb
          state: present
      - name: Create database user
        module: postgresql_user
        params:
          name: appuser
          password: "{{ vault_db_password }}"
          priv: "appdb:ALL"
      - name: Configure PostgreSQL for remote connections
        module: lineinfile
        params:
          path: /etc/postgresql/14/main/postgresql.conf
          regexp: "^#?listen_addresses"
          line: "listen_addresses = '*'"
        notify: restart postgresql
    ansible_vars:
      postgresql_version: 14
      postgresql_max_connections: 200

  - name: app-server-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 2
    sockets: 1
    memory: 4096
    disk:
      size: 50G
      type: scsi
      storage: local-lvm
    network:
      model: virtio
      bridge: vmbr0
      tag: 100
    ipconfig: ip=192.168.100.12/24,gw=192.168.100.1
    onboot: true
    agent: 1
    ssh_user: ubuntu
    tags:
      - application
      - python
      - development
    # Ansible roles for application server
    ansible_roles:
      - common
      - nodejs           # Node.js runtime
      - nginx            # Reverse proxy
      - certbot          # SSL certificates
      - monitoring-agent
    # Custom tasks for application deployment
    ansible_tasks:
      - name: Install PM2 process manager
        module: npm
        params:
          name: pm2
          global: yes
      - name: Clone application repository
        module: git
        params:
          repo: https://github.com/myorg/myapp.git
          dest: /opt/myapp
          version: main
      - name: Install application dependencies
        module: npm
        params:
          path: /opt/myapp
      - name: Create PM2 ecosystem file
        module: template
        params:
          src: ecosystem.config.js.j2
          dest: /opt/myapp/ecosystem.config.js
      - name: Start application with PM2
        module: command
        params:
          cmd: pm2 start ecosystem.config.js
          chdir: /opt/myapp
    ansible_vars:
      nodejs_version: "18.x"
      app_port: 3000
      domain_name: app.example.com

  # Tailscale exit node example (regular Ubuntu)
  - name: exit-node-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 2
    sockets: 1
    memory: 2048
    disk:
      size: 20G
      type: scsi
      storage: local-lvm
    network:
      model: virtio
      bridge: vmbr0
      tag: 100
    ipconfig: ip=192.168.100.20/24,gw=192.168.100.1
    onboot: true
    agent: 1
    ssh_user: ubuntu
    tags:
      - tailscale
      - exit-node
      - vpn
    # Configure as Tailscale exit node
    ansible_roles:
      - common
      - tailscale-exit-node
    ansible_vars:
      tailscale_auth_key: "{{ vault_tailscale_auth_key }}"
      tailscale_hostname: "exit-node-dev-01"
      tailscale_exit_node: true
      tailscale_accept_routes: true
      # Optionally advertise local subnets
      tailscale_advertise_routes:
        - "192.168.100.0/24"

  # Tailscale exit node on Ubuntu Core (immutable)
  - name: exit-node-core-01
    target_node: pve01
    clone: ubuntu-core-22-template
    cores: 2
    sockets: 1
    memory: 2048
    disk:
      size: 20G
      type: scsi
      storage: local-lvm
    network:
      model: virtio
      bridge: vmbr0
      tag: 100
    ipconfig: ip=192.168.100.21/24,gw=192.168.100.1
    onboot: true
    agent: 1
    ssh_user: ubuntu
    tags:
      - tailscale
      - exit-node
      - ubuntu-core
      - immutable
    # Tailscale on Ubuntu Core uses snap automatically
    ansible_roles:
      - tailscale-exit-node
    ansible_vars:
      tailscale_auth_key: "{{ vault_tailscale_auth_key }}"
      tailscale_hostname: "exit-node-core-dev-01"
      tailscale_exit_node: true
      tailscale_snap_channel: "latest/stable"
