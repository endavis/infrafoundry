vms:
  # ------------------------------------------------------------------
  # Mixed Runner Example (Monolithic)
  # ------------------------------------------------------------------
  # This file demonstrates how resources using different configuration
  # runners can coexist in the same file.

  # 1. Basic VM (Terraform Only)
  - name: basic-vm-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 1
    memory: 1024
    ipconfig: ip=192.168.100.50/24,gw=192.168.100.1
    tags: [terraform, basic]

  # 2. VM with Ansible Configuration
  - name: web-server-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 2
    memory: 4096
    ipconfig: ip=192.168.100.10/24,gw=192.168.100.1
    ssh_user: ubuntu
    tags: [ansible, webserver]
    
    ansible_roles:
      - common
      - webserver
    ansible_vars:
      webserver_port: 80

  # 3. VM with PyInfra Configuration
  - name: pyinfra-custom-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 2
    memory: 2048
    ipconfig: ip=192.168.100.31/24,gw=192.168.100.1
    ssh_user: ubuntu
    tags: [pyinfra, custom]
    
    pyinfra_deploy_funcs:
      - webserver.setup_webserver
      - webserver.setup_monitoring

  # 4. Hybrid VM (Ansible + PyInfra)
  # Demonstrates using both runners on the same resource.
  # Runners execute in fixed order: Terraform -> Ansible -> PyInfra.
  # For more details, see docs/runners/overview.md
  - name: hybrid-server-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 2
    memory: 4096
    ipconfig: ip=192.168.100.40/24,gw=192.168.100.1
    ssh_user: ubuntu
    tags: [hybrid]

    # Ansible handles base system config
    ansible_roles:
      - common
    
    # PyInfra handles application deployment
    pyinfra_ops:
      - name: Install htop (via PyInfra)
        operation: apt.packages
        params:
          packages: ["htop"]
          update: true
          _sudo: true

  # ------------------------------------------------------------------
  # Multi-NIC VM Example
  # ------------------------------------------------------------------
  # Demonstrates multiple network interfaces with different adapter models
  - name: multi-nic-vm-01
    target_node: pve01
    clone: ubuntu-22-04-template
    cores: 4
    memory: 8192
    ipconfig: ip=192.168.100.60/24,gw=192.168.100.1
    ssh_user: ubuntu
    tags: [terraform, multi-nic]
    network:
      - bridge: vmbr0
        tag: 100
        model: virtio
      - bridge: vmbr1
        tag: 200
        model: virtio
      - bridge: vmbr2
        tag: 300
        model: e1000e

  # ------------------------------------------------------------------
  # Nested ESXi VM Example
  # ------------------------------------------------------------------
  # Demonstrates advanced VM settings for nested virtualization
  - name: esxi-nested-01
    target_node: pve01
    clone: esxi-8-template
    vmid: 200
    cores: 8
    sockets: 1
    memory: 32768
    cpu_type: host
    machine: q35
    bios: ovmf
    balloon: 0
    tags: [terraform, esxi, nested]
    disk:
      storage: local-lvm
      size: 100G
      type: sata
    efi_disk:
      storage: local-lvm
    network:
      - bridge: vmbr0
        tag: 100
        model: vmxnet3
      - bridge: vmbr1
        tag: 200
        model: vmxnet3

  # ------------------------------------------------------------------
  # ISO Boot VM Example
  # ------------------------------------------------------------------
  # Demonstrates booting from an ISO instead of cloning a template
  - name: installer-vm-01
    target_node: pve01
    vmid: 300
    cores: 2
    memory: 4096
    tags: [terraform, iso-boot]
    iso: local:iso/ubuntu-24.04-server.iso
    disk:
      storage: local-lvm
      size: 50G
      type: scsi
    network:
      - bridge: vmbr0
        model: virtio
