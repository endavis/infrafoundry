# Rocky Linux 9 Cloud Image Template (blueprint-based)
#
# Uses the rocky9-template blueprint. Only per-instance overrides live here.
# See blueprints/rocky9-template/README.md for the full variable reference.
#
# Run: infra apply --env dev --package rocky9-template

name: rocky9-template
description: "Rocky Linux 9 cloud image template (example)"
blueprint: rocky9-template

variables:
  vmid: 901
  target_node: pve1
  storage: local-lvm
