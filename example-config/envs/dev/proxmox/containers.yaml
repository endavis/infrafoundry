containers:
  # ------------------------------------------------------------------
  # Basic Alpine LXC Container
  # ------------------------------------------------------------------
  # Minimal container with DHCP networking
  - name: alpine-basic-01
    target_node: pve01
    ctid: 300
    ostemplate: "nas01:vztmpl/alpine-3.21-default_20250108_amd64.tar.xz"
    ostype: alpine
    cores: 1
    memory: 64
    swap: 0
    rootfs:
      storage: local-lvm
      size: 1
    network:
      - name: eth0
        bridge: vmbr0
        ip: dhcp
    hostname: alpine-basic-01
    unprivileged: true
    onboot: true
    start: true
    tags: [alpine, basic]

  # ------------------------------------------------------------------
  # Ubuntu Container with Mount Points and Static IP
  # ------------------------------------------------------------------
  # Web server container with NFS-mounted webroot
  - name: web-01
    target_node: pve01
    ctid: 301
    ostemplate: "nas01:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
    ostype: ubuntu
    cores: 2
    memory: 256
    swap: 128
    rootfs:
      storage: nas01
      size: 4
    network:
      - name: eth0
        bridge: vmbr0
        tag: 10
        ip: 192.168.10.50/24
        gw: 192.168.10.1
        firewall: true
    mount_point:
      - volume: "nas01:infra"
        path: /var/www/html
        shared: true
        read_only: true
    hostname: web-01
    dns:
      domain: example.com
      servers: ["192.168.10.1", "1.1.1.1"]
    ssh_keys: ["ssh-rsa AAAA... user@host"]
    unprivileged: true
    onboot: true
    start: true
    tags: [ubuntu, webserver, infra]
    startup:
      order: 2
      up_delay: 10
      down_delay: 5

  # ------------------------------------------------------------------
  # Container with Nesting and NFS Features
  # ------------------------------------------------------------------
  # Docker-in-LXC with NFS mount support
  - name: docker-host-01
    target_node: pve01
    ctid: 302
    ostemplate: "nas01:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst"
    ostype: debian
    cores: 4
    memory: 2048
    swap: 512
    rootfs:
      storage: local-lvm
      size: 16
    network:
      - name: eth0
        bridge: vmbr0
        tag: 10
        ip: 192.168.10.51/24
        gw: 192.168.10.1
      - name: eth1
        bridge: vmbr1
        tag: 20
        ip: 192.168.20.51/24
    mount_point:
      - volume: "nas01:docker-data"
        path: /var/lib/docker
        shared: true
      - volume: "nas01:backups"
        path: /mnt/backups
        read_only: true
        backup: false
    hostname: docker-host-01
    dns:
      domain: example.com
      servers: ["192.168.10.1"]
    ssh_keys: ["ssh-rsa AAAA... admin@host"]
    unprivileged: false
    features:
      nesting: true
      mount: [nfs, cifs]
      keyctl: true
    onboot: true
    start: true
    tags: [debian, docker, infra]
    startup:
      order: 3
      up_delay: 15
      down_delay: 10
    console:
      enabled: true
      type: console
      tty_count: 2
