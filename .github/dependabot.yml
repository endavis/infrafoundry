version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    # Defends auto-merge against supply-chain attacks that publish malicious
    # versions and are yanked within hours-to-days. Security-update PRs
    # (advisory-driven) bypass cooldown, so CVE patching is not delayed.
    cooldown:
      default-days: 7
      include:
        - "*"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage"
          # No update-types on this group, so it can take bumps that dependabot
          # cannot classify as minor/patch and would never put in the catch-all
          # (#1231): type stubs version as <upstream>.<date> (a 4th-component
          # bump), and [build-system] requires are not in uv.lock.
          - "types-*"
          - "hatchling"
          - "hatch-vcs"
        exclude-patterns:
          # Must equal sensitive_dependencies in automerge-config.json, as on the
          # catch-all: "types-*" would otherwise catch e.g. types-pyOpenSSL.
          - "crypt*"
          - "*ssl*"
          - "*security*"
          - "auth*"
          - "*jwt*"
          - "*oauth*"
      # Catch-all: one PR per weekly batch of minor/patch bumps instead of one per
      # dependency. Under the `strict` ruleset every merge makes the other open
      # PRs rebase and re-run CI (issue #1221). Must stay LAST: a dependency
      # matching several groups goes to the first one listed. exclude-patterns
      # must equal `sensitive_dependencies` in .github/automerge-config.json
      # (tests/test_dependabot_config.py asserts it), or one sensitive bump would
      # hold the whole batch from auto-merge.
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "crypt*"
          - "*ssl*"
          - "*security*"
          - "auth*"
          - "*jwt*"
          - "*oauth*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # `codeql-action/init` and `codeql-action/analyze` are separate dependencies
      # to dependabot but a single unit to CodeQL: `init` writes a config file
      # stamped with its own version and `analyze` refuses to load a config
      # written by a different one ("Loaded a configuration file for version
      # '4.37.8', but running version '4.37.9'"). Ungrouped, dependabot opens one
      # PR per sub-action and both fail, with neither able to unblock the other.
      # See issue #799. tests/test_codeql_workflow.py asserts the two stay pinned
      # to the same SHA.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Catch-all, last on purpose; see the uv ecosystem above and issue #1221.
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "crypt*"
          - "*ssl*"
          - "*security*"
          - "auth*"
          - "*jwt*"
          - "*oauth*"
        update-types:
          - "minor"
          - "patch"
