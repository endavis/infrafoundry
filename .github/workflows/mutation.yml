name: Mutation Testing

on:
  schedule:
    - cron: "0 0 * * 0"  # Sunday midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      # As in ci.yml: no per-example deadline, so a slow runner cannot fail a
      # property test on timing and stop the run.
      HYPOTHESIS_PROFILE: ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: pv
        uses: ./.github/actions/python-versions

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pv.outputs.newest }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install system tools (age, sops)
        run: |
          mkdir -p ~/.local/bin
          AGE_VERSION=$(curl -s https://api.github.com/repos/FiloSottile/age/releases/latest -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq -r .tag_name)
          curl -sL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          mv /tmp/age/age /tmp/age/age-keygen ~/.local/bin/
          SOPS_VERSION=$(curl -s https://api.github.com/repos/getsops/sops/releases/latest -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq -r .tag_name)
          curl -sL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o ~/.local/bin/sops
          chmod +x ~/.local/bin/sops

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run mutmut
        timeout-minutes: 120
        run: |
          mkdir -p tmp
          # Surviving mutants do not fail this step. mutmut exits non-zero only
          # when it cannot test the mutants at all, as when its stats run fails.
          # This line used to end in `|| true`, which kept the job green through
          # months of runs that checked no mutant (#873).
          if ! uv run mutmut run > tmp/mutmut-run-raw.log 2>&1; then
            echo "::error::mutmut could not test the mutants. The Mutation results step prints its log."
            exit 1
          fi

      - name: Mutation results
        if: always()
        run: |
          mkdir -p tmp
          if [ -f tmp/mutmut-run-raw.log ]; then
            # Strip spinner/carriage-return noise from log.
            # mutmut renders progress with braille spinners + \r; convert \r to \n,
            # drop blank lines, and drop the repeating spinner phrases.
            tr '\r' '\n' < tmp/mutmut-run-raw.log \
              | grep -v '^[[:space:]]*$' \
              | grep -avE 'Generating mutants|Running stats|Running clean tests|Running mutation testing|Running forced fail test|^[[:space:]]*[^[:alnum:]]*[[:space:]]*[0-9]+/[0-9]+' \
              > tmp/mutmut-run.log || true
            echo "=== Mutation run log ==="
            cat tmp/mutmut-run.log
          fi
          # mutmut leaves killed mutants out of its results unless asked with
          # --all, and without them the run cannot give a score (#878).
          uv run mutmut results --all true > tmp/mutmut-results.txt 2>/dev/null || true
          echo "=== Mutants not killed ==="
          grep -v ': killed$' tmp/mutmut-results.txt || true
          counts=$(awk -F': ' 'NF {print $NF}' tmp/mutmut-results.txt | sort | uniq -c | sort -rn)
          total=$(grep -c . tmp/mutmut-results.txt || true)
          killed=$(grep -c ': killed$' tmp/mutmut-results.txt || true)
          # The score as docs/development/ci-cd-testing.md defines it: killed
          # mutants as a percentage of all mutants generated.
          if [ "$total" -gt 0 ]; then
            score="$(awk -v k="$killed" -v t="$total" 'BEGIN { printf "%.1f%%", 100 * k / t }') (${killed} of ${total} mutants killed)"
          else
            score="none, as mutmut listed no mutants"
          fi
          echo ""
          echo "=== Summary ==="
          if [ -n "$counts" ]; then
            echo "$counts"
          fi
          echo "Mutation score: ${score}"
          {
            echo "### Mutation testing"
            echo ""
            echo "Mutation score: ${score}"
            if [ -n "$counts" ]; then
              echo ""
              echo "| Status | Mutants |"
              echo "| :--- | ---: |"
              echo "$counts" | while read -r count status; do
                echo "| ${status} | ${count} |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: tmp/mutmut-results.txt
          retention-days: 90
