name: Publish to TestPyPI

on:
  workflow_dispatch:
  # PEP440 pre-release tag patterns. commitizen (used by doit release) emits
  # these forms, not semver-style v*-alpha.* tags. See pyproject-template#659.
  push:
    tags:
      - "v*a[0-9]*"       # alpha: v0.1.0a0
      - "v*b[0-9]*"       # beta: v0.1.0b1
      - "v*rc[0-9]*"      # rc: v0.1.0rc0
      - "v*.dev[0-9]*"    # dev: v0.1.0.dev2

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: pv
        uses: ./.github/actions/python-versions

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pv.outputs.newest }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Show resolved version
        run: |
          uv run python - <<'PY'
          import infrafoundry
          print(f"Resolved version: {infrafoundry.__version__}")
          PY

      - name: Build artifacts
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
