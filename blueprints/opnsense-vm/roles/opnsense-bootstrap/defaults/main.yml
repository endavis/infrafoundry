---
# OPNsense Bootstrap — Default Variables

opnsense_domain: lab.local
opnsense_wan_prefix: 24
opnsense_lan_prefix: 24
opnsense_api_allow_cidr: "192.0.2.0/24"
# Also allow api_allow_cidr to reach TCP 443 on the LAN address, through the WAN interface
opnsense_api_allow_lan: false

# Optional sync NIC (em2, assigned as opt1). Empty sync_bridge keeps the two-NIC VM.
opnsense_sync_bridge: ""
opnsense_sync_ip: ""
opnsense_sync_prefix: 24
opnsense_sync_if: em2
opnsense_sync_descr: SYNC

# Seconds to wait for the first login prompt on the serial console
opnsense_boot_timeout: 600

# Interface names the nano image's default config assigns. The expect
# script answers the interactive assignment with these if it appears.
opnsense_lan_if: em0
opnsense_wan_if: em1

# Base64 is sent to the console in pieces this long, keeping each shell
# line well under the terminal's input limit.
opnsense_send_chunk: 160

# Boot disk size in GiB the VM was built with (0 = the image's own size).
# When above 0, the bootstrap runs an idempotent grow step on the console.
opnsense_disk_size: 0
