---
# ONTAP Simulator Lab — Full Orchestration Playbook
#
# Runs serial setup, cluster setup, and console restore in sequence.
# For selective runs, use the individual playbooks:
#   - ontap-sim-serial-setup.yml    (first boot only — sets sysid on node 02)
#   - ontap-sim-cluster-setup.yml   (cluster create, join, post-config)
#   - ontap-sim-console-restore.yml (revert noVNC to video primary; opt-out
#                                    via ontap_restore_console=false)
#
# Usage (automated — all variables from infrafoundry.yml):
#   Triggered by ontap-post-terraform.sh event handler
#
# Usage (manual):
#   ansible-playbook -i .generated-inventory.yml ontap-sim-playbook.yml \
#     -e @.generated-vars.json -v

- name: Serial setup
  ansible.builtin.import_playbook: ontap-sim-serial-setup.yml

- name: Cluster setup
  ansible.builtin.import_playbook: ontap-sim-cluster-setup.yml

- name: Console restore
  ansible.builtin.import_playbook: ontap-sim-console-restore.yml
