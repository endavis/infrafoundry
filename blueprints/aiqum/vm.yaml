# AIQUM VM — shorthand vms: format (proxmox provider, vm type inferred).
# Multi-instance safe: outer name is templated.
vms:
  - name: "{{ vm_name }}"
    vmid: {{ vmid }}
    target_node: "{{ target_node }}"
    clone:
      vm_id: {{ template_vmid }}
      node_name: "{{ template_node }}"
    cores: {{ cores }}
    memory: {{ memory }}
    agent: true
    disk:
      storage: "{{ disk_storage }}"
      size: {{ disk_size }}
    network:
      - bridge: "{{ bridge }}"
        tag: {{ vlan_tag }}
{% if mac_address %}
        macaddr: "{{ mac_address }}"
{% endif %}
    cloud_init_snippets:
      - users/ansible
      - network/dhcp
      - packages/qemu-agent
      - system/hostname
    cloud_init_vars:
      HOSTNAME: "{{ vm_name }}"
    tags: {{ ["ontap", "aiqum"] + extra_tags }}
    onboot: true
