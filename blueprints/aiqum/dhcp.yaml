# AIQUM DHCP reservation — opnsense in a proxmox-providered package directory.
# Uses generic resources: format because the resource provider differs from the
# package directory provider. Outer name is templated for multi-instance safety.
resources:
  - provider: opnsense
    type: kea.dhcp4.reservations
    name: "{{ vm_name }}"
    config:
      subnet_ref: "{{ dhcp_subnet }}"
      hw_address: "{{ mac_address | lower }}"
      ip_address: "{{ ip_address }}"
      hostname: "{{ vm_name }}"
      description: "NetApp Active IQ Unified Manager"
