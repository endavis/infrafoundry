name: k3s-cluster
description: "k3s Kubernetes cluster — multi-provider (Proxmox or OCI)"
version: "1.0.0"

inputs:
  # --- Shared cluster identity (top-level, required for every provider) ---
  - name: cluster_name
    description: "Shared cluster identifier used across providers"
    default: k3s-cluster
  - name: k3s_version
    description: "k3s release to install (empty = latest)"
    default: ""
  - name: k3s_server_args
    description: 'Extra k3s server install flags, e.g. "--disable traefik"'
    default: ""

providers:
  # =====================================================================
  # Proxmox — Rocky 9 VMs (1 server + N agents)
  # =====================================================================
  proxmox:
    inputs:
      # --- Required per-instance inputs ---
      - name: server_name
        description: "Hostname / Proxmox VM name for the k3s server"
      - name: server_vmid
        description: "Proxmox VM ID for the server"
        type: integer
      - name: server_target
        description: "Proxmox node to deploy the server onto"
      - name: server_ip
        description: "Static IPv4 address for the server (DHCP reservation)"
      - name: server_mac
        description: "MAC address for the server's network interface"
      - name: agents
        description: "List of k3s agent definitions (name/vmid/target_node/mac/ip)"
        type: list
      - name: dhcp_subnet
        description: "OPNsense DHCP subnet identifier used for reservations"

      # --- Template ---
      - name: template_vmid
        description: "Standard rocky9-template vmid"
        default: 901
      - name: template_node
        description: "Proxmox node hosting the template"
        default: pve1

      # --- VM hardware ---
      - name: cores
        default: 2
      - name: memory
        description: "Memory (MiB)"
        default: 4096
      - name: disk_size
        description: "Disk size (GiB)"
        default: 56
      - name: disk_storage
        default: local-lvm

      # --- Network ---
      - name: bridge
        default: vmbr0
      - name: vlan_tag
        default: 10

      # --- SSH access ---
      - name: jumphost
        default: ""

      # --- k3s installer flags (proxmox override of top-level default) ---
      - name: k3s_server_args
        default: "--disable traefik --disable servicelb"

      # --- Local kubeconfig destination directory ---
      - name: kubeconfig_dir
        default: "~/.kube"

      # Extra Proxmox tags appended to the blueprint's default tags
      - name: extra_tags
        default: []

    resources:
      - providers/proxmox/vm.yaml
      - providers/proxmox/dhcp.yaml

    events:
      on_create:
        - type: script
          name: k3s-install
          script: scripts/proxmox/k3s-post-terraform.sh
          description: "Install k3s server and agents after VMs are created"
          timeout: 1800
          continue_on_error: false
          requires:
            - "{{ server_name }}"

  # =====================================================================
  # OCI — ARM Always-Free-Tier (1 control + N workers) with Tailscale
  # =====================================================================
  oci:
    inputs:
      # --- Required per-instance inputs ---
      - name: image
        description: "OCI compute image OCID for cluster instances"
      - name: ssh_public_key
        description: "SSH public key material injected into instances"

      - name: control_name
        default: k3s-control

      # --- OCI instance sizing ---
      - name: instance_shape
        default: "VM.Standard.A1.Flex"
      - name: control_ocpus
        default: 2
      - name: control_memory_gb
        default: 8
      - name: control_boot_volume_gb
        default: 50
      - name: worker_boot_volume_gb
        default: 50

      - name: workers
        default:
          - name: k3s-worker-0
            ocpus: 1
            memory_gb: 8
          - name: k3s-worker-1
            ocpus: 1
            memory_gb: 8

      # --- Network ---
      - name: vcn_name
        default: k3s-vcn
      - name: vcn_cidr
        default: "10.0.0.0/16"
      - name: vcn_dns_label
        default: k3svcn
      - name: control_subnet_name
        default: k3s-control-subnet
      - name: control_subnet_cidr
        default: "10.0.0.0/24"
      - name: control_subnet_dns_label
        default: ctrl
      - name: worker_subnet_name
        default: k3s-worker-subnet
      - name: worker_subnet_cidr
        default: "10.0.1.0/24"
      - name: worker_subnet_dns_label
        default: work

      # --- Tailscale ---
      - name: tailnet
        default: ""
      - name: ts_tags
        default: []
      - name: extra_freeform_tags
        default: {}

      # --- k3s OCI-specific ---
      - name: k3s_oci_firewall_fix
        default: true

      # --- Local kubeconfig destination ---
      - name: kubeconfig_local_path
        default: "~/.kube/{{ cluster_name }}.yaml"

    resources:
      - providers/oci/network.yaml
      - providers/oci/instance.yaml

    events:
      on_create:
        - type: script
          name: k3s-install
          script: scripts/oci/k3s-post-terraform.sh
          description: "Install k3s server and workers via ansible after instances are created"
          timeout: 1800
          continue_on_error: false
          requires:
            - "{{ control_name }}"

      before_destroy:
        - type: script
          name: tailscale-cleanup
          script: scripts/oci/cleanup-tailscale-devices.sh
          description: "Remove Tailscale devices for this cluster before destroy"
          timeout: 60
          continue_on_error: true

      after_apply:
        - type: script
          name: verify-cluster
          script: scripts/oci/verify-cluster.sh
          description: "Verify k3s cluster health after apply"
          timeout: 120
          continue_on_error: true
