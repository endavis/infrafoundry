---
# k3s node kubeconfig mode playbook.
#
# Runs only the k3s-kubeconfig-mode role on the control plane, so existing
# clusters get the owner-only kubeconfig the install roles now set on create.
# It never installs, restarts or removes k3s. Run by scripts/oci/k3s-kubeconfig-mode.sh
# on every apply.

- name: Keep the node kubeconfig owner-only on the control plane
  hosts: k3s_control
  gather_facts: false
  become: true
  roles:
    - k3s-kubeconfig-mode
