name: routeros-chr
description: "Disposable MikroTik RouterOS CHR VM on Proxmox, bootstrapped for the REST API"
version: "1.0.0"

# Package secrets (secrets.yaml `variables:`), passed to the bootstrap only:
#   routeros_admin_password  password set on the admin user
# The same password goes in the environment's mikrotik provider settings.

inputs:
  # --- Required per-instance inputs (no default) ---
  - name: vm_name
    description: "Proxmox VM name, also the router's identity"
  - name: vmid
    description: "Proxmox VM ID"
    type: integer
  - name: target_node
    description: "Proxmox node to create the VM on"
  - name: pve_host
    description: "Address Ansible uses to reach target_node over SSH (root)"

  # --- Proxmox ---
  - name: disk_storage
    default: local-lvm
  - name: memory
    type: integer
    default: 512
  - name: cores
    type: integer
    default: 1

  # --- Image (CHR .img.zip; extracted on the PVE host with python3) ---
  - name: image_source
    default: "https://download.mikrotik.com/routeros/7.25.1/chr-7.25.1.img.zip"
  - name: image_sha256
    description: "sha256 of the downloaded .img.zip (empty skips the check)"
    default: "c78e8e24ca78d7f13496140e600702df07fe5c57d1a5d6d025654c8476ed2ed2"
  - name: image_cache_dir
    default: "/var/lib/vz/template/cache/infrafoundry"

  # --- Management NIC (ether1) ---
  - name: mgmt_bridge
    default: vmbr0
  - name: mgmt_vlan
    description: "VLAN tag for the management NIC; 0 means untagged"
    type: integer
    default: 0
  - name: mgmt_ip
    description: "Static address of ether1; empty keeps the DHCP client (the address is then not probed)"
    default: ""
  - name: mgmt_prefix
    type: integer
    default: 24
  - name: mgmt_gateway
    description: "Default gateway; used only with mgmt_ip"
    default: ""
  - name: mgmt_dns
    description: "DNS server for the router itself; a comma-separated list sets several; used only with mgmt_ip; empty sets none"
    default: ""

  # --- Trunk NICs (ether2..) ---
  - name: trunk_bridge
    default: vmbr1
  - name: trunk_nics
    description: "Number of trunk NICs after the management NIC"
    type: integer
    default: 2

  - name: https_bootstrap
    description: "Create and sign a self-signed bootstrap-https certificate and enable www-ssl/api-ssl with it; www stays on"
    type: boolean
    default: false

  - name: boot_timeout
    description: "Seconds to wait for the first login prompt on the serial console"
    type: integer
    default: 300

  # Base Proxmox tags; extra_tags are appended to them. Changing base_tags on an
  # existing VM changes its tags, which replaces an imported VM
  - name: base_tags
    description: "Base Proxmox tags for the VM; extra_tags are appended"
    default: [routeros, chr-test]
  # Extra Proxmox tags appended to base_tags
  - name: extra_tags
    default: []

resources:
  - vm.yaml

events:
  on_create:
    - type: script
      name: routeros-bootstrap
      script: scripts/routeros-post-terraform.sh
      description: "Boot the VM, set the admin password, address and REST service over the serial console"
      timeout: 900
      continue_on_error: false
      requires:
        - "{{ vm_name }}"
