---
# RouterOS Bootstrap — Default Variables

# Management interface (the first NIC) and its optional static address.
# An empty routeros_mgmt_ip keeps the DHCP client.
routeros_mgmt_if: ether1
routeros_mgmt_ip: ""
routeros_mgmt_prefix: 24
routeros_mgmt_gateway: ""
# DNS servers of the router itself; a comma-separated list sets several
routeros_mgmt_dns: ""

# Create and sign a self-signed certificate and serve www-ssl/api-ssl with it
routeros_https_bootstrap: false
routeros_https_cert_name: bootstrap-https

# Seconds to wait for the first login prompt on the serial console
routeros_boot_timeout: 300
