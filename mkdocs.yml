site_name: InfraFoundry
site_description: Infrastructure automation framework with pluggable providers (Proxmox, OPNsense, Kubernetes, OCI)
site_author: Eric Davis
site_url: https://endavis.github.io/infrafoundry

repo_name: endavis/infrafoundry
repo_url: https://github.com/endavis/infrafoundry
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

# `docs/` deliberately links to real repository files that live outside
# `docs_dir` — AGENTS.md, README.md, .github/CONTRIBUTING.md, hook scripts
# under tools/, and their tests. Those links are kept relative so they resolve
# when the repository is browsed on GitHub, which is how a template is mostly
# read, and so downstream forks resolve to their own files rather than to this
# upstream repo.
#
# mkdocs 1.6 reports those identically to genuinely broken links
# (`links.not_found`), so silencing one silences the other. `not_found` is
# therefore ignored here and link validation lives in
# `tests/test_markdown_links.py`, which resolves every relative link against the
# whole repository — including the out-of-docs links mkdocs can never check.
# Anchors are still validated here, where mkdocs has the rendered headings.
#
# Trade-off: the out-of-docs links do not resolve on the published site.
# `decisions/adr-template.md` is a scaffold, not a decision record: it carries
# placeholder text and intentionally unresolvable links (`../path/to/doc.md`).
# Listing it in the nav would present a fill-in-the-blanks form to readers as
# though it were content, and `doit adr` is how an ADR is actually created. It
# is excluded deliberately rather than left to drift out of the nav unnoticed.
not_in_nav: |
  decisions/adr-template.md
  architecture/plans/
  architecture/runner-protocol-proposal-archive.md
  development/opnsense-spike-*.md
  validation/

validation:
  nav:
    # Any other page missing from the nav is an oversight; surface it. With
    # `mkdocs build --strict` this fails the docs job rather than scrolling
    # past as INFO, which is how seven pages became unreachable (#688).
    omitted_files: warn
  links:
    not_found: ignore
    unrecognized_links: ignore
    anchors: warn

