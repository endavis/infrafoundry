[project]
name = "infrafoundry"
description = "Infrastructure automation framework with pluggable providers (Proxmox, OPNsense, Kubernetes)"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.5.0",
    "doit>=0.36.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "ansible>=14.2.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "opnsense-openapi>=0.5.0",
    "pyinfra>=3.10.0",
    "boto3>=1.43.67",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.11.0",
]

[project.optional-dependencies]
dev = [
    "codespell>=2.4.3",
    "commitizen>=4.19.2",
    "coverage-badge>=1.1.0",
    "doit>=0.36.0",
    "hypothesis>=6.169.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pymdown-extensions>=12.2",
    "pyproject-fmt>=2.30.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pyyaml>=6.0",
    "radon>=6.0",
    "ruff>=0.17.0",
    "types-boto3>=1.43.67",
    "types-PyYAML>=6.0.12.20260906",
    "types-requests>=2.33.0.20260712",
    "vulture>=2.11",
]
security = [
    "bandit>=1.7",
    "cyclonedx-bom>=7.5.0",
    "pip>=26.2.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=4.0",
]
# Optional SOCKS proxy support for the OPNsense provider's `proxy` setting
# (httpx requires the `socksio` package to handle `socks5://` proxy URLs).
# Install with `infrafoundry[socks]`. HTTP/HTTPS CONNECT proxies need nothing extra.
socks = [
    "socksio>=1.0.0",
]

[project.scripts]
foundry = "infrafoundry.cli:foundry"

[project.entry-points."infrafoundry.plugin_types"]
provider = "infrafoundry.providers.plugin_type:ProviderPluginType"
secret_backend = "infrafoundry.secrets.plugin_type:SecretBackendPluginType"

[project.entry-points."infrafoundry.providers"]
proxmox = "infrafoundry.providers.proxmox:register"

[project.entry-points."infrafoundry.secrets"]
env = "infrafoundry.secrets.backends.env:register"
env_secrets = "infrafoundry.secrets.backends.env_secrets:register"
file = "infrafoundry.secrets.backends.file:register"

[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.uv]
# Override pyinfra 3.8.0's precautionary `paramiko<5` cap so we can pick up
# paramiko 5.x (which contains the CVE-2026-44405 fix at commit a4489456).
# Probe (2026-05-18) confirmed pyinfra's SSH connector references only
# `paramiko.SSHClient` and none of the APIs removed in paramiko 5
# (DSAKey, GSSAPI, SHA-1 KEX names). Drop this override when pyinfra
# releases a version that lifts the cap natively.
override-dependencies = ["paramiko>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/infrafoundry"]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?:v|d)(?P<version>.+)$"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/infrafoundry/_version.py"

[tool.ruff]
cache-dir = "tmp/.ruff_cache"
line-length = 100
target-version = "py312"
extend-exclude = ["**/_version.py"]

[tool.ruff.lint]
# Enable preview mode but require rules to be listed by exact code so we can
# opt into specific preview rules without pulling in every unstable preview
# rule. (PLW1514, the UTF-8 file-I/O rule, is NOT enabled yet — enabling it
# would flag 180+ existing call sites. Schedule a separate refactor to
# encoding= every text-mode open/read_text/write_text call before opting in.)
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) - intentional in plugin interfaces
]

[tool.ruff.lint.per-file-ignores]
"src/infrafoundry/cli/main.py" = ["E402"]  # CLI command imports after group setup
"tests/**/*.py" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN002",   # Missing type annotation for *args
    "ANN003",   # Missing type annotation for **kwargs
    "ANN201",   # Missing return type annotation for public function
    "ANN202",   # Missing return type annotation for private function
]
"tools/opnsense-parser.py" = [
    "N999",     # Invalid module name (filename has hyphen)
    "ANN201",   # Missing return type annotation
    "SIM102",   # Nested if statements (legacy script)
]
"tools/pyproject_template/*.py" = [
    "ANN401",   # Any return type for dynamic GitHub API responses
    "RUF022",   # __all__ intentionally grouped by category, not sorted
]
"tests/benchmarks/*.py" = [
    "ANN401",   # benchmark fixture has no py.typed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
cache_dir = "tmp/.mypy_cache"
python_version = "3.12"
# Strict type checking
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
# Additional strict checks
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
exclude = [".claude/", ".codex/"]

[[tool.mypy.overrides]]
module = "doit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tools/pyproject_template/ scripts run standalone and do `sys.path.insert`
# before importing their siblings by bare name (`from utils import ...`).
# mypy cannot resolve those, so suppress the import errors by naming the
# sibling modules (pyproject-template #700, #705).
module = [
    "check_template_updates",
    "cleanup",
    "configure",
    "repo_settings",
    "settings",
    "setup_repo",
    "utils",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytest imports tests/agent_roster.py as `agent_roster` via `pythonpath = ["tests"]`.
# tests/ is a package here, so pointing mypy_path at it makes mypy see the file
# twice (as `tests.agent_roster` and `agent_roster`); suppress the bare import instead.
module = "agent_roster"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Template-owned tooling is written against the template's mypy config, which
# leaves disallow_any_generics off. Apply that here too so those files stay
# identical to the template; InfraFoundry's own code keeps the stricter setting.
module = [
    "tools.doit.*",
    "tools.generate_doc_toc",
    "tools.pyproject_template.*",
    "tools.hooks.*",
]
disallow_any_generics = false

[tool.pytest.ini_options]
minversion = "8.0"
# pytest-benchmark reads its settings only from these flags, never from a pyproject table (#879).
# Disabled runs ignore them, so they apply only when a benchmark run adds --benchmark-enable.
addopts = "-v --tb=short --strict-config --strict-markers --benchmark-disable --benchmark-disable-gc --benchmark-warmup=on"
testpaths = ["tests"]
# tests/ is a package here (tests/__init__.py), so pytest does not put it on
# sys.path by itself; shared helpers like tests/agent_roster.py need it.
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full workflows",
    "slow: Tests that take significant time to run",
    "benchmark: marks tests as performance benchmarks (deselect with '--benchmark-disable')",
    "property: marks tests as property-based tests (run with Hypothesis)",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "v$version"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true
# Merge pre-release entries into final release in CHANGELOG
merge_prerelease = true
# Commit types that trigger version bumps
bump_pattern = "^(feat|fix|refactor|perf)"
bump_map = { "feat" = "MINOR", "fix" = "PATCH", "refactor" = "PATCH", "perf" = "PATCH" }
# BREAKING CHANGE in commit message triggers MAJOR bump
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]

[tool.bandit]
exclude_dirs = [
    "tests",
    "tmp",
    ".venv",
    "docs",
    "examples",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "site",
    ".claude",
    ".codex",
    ".devcontainer",
    ".vscode",
]
skips = [
    "B101",
    "B603",
    "B607",
]

[tool.codespell]
skip = "tmp,.venv,.git,*.lock,*.pyc,__pycache__"
ignore-words-list = "applyable"

[tool.coverage.run]
branch = true
data_file = "tmp/.coverage"
# `tools/` is the code that runs releases, creates PRs and blocks dangerous
# commands, so it is gated alongside the package (pyproject-template #709).
source = ["infrafoundry", "tools"]
omit = [
    # The template's own management suite; its tests are template-owned (ADR-9017).
    "tools/pyproject_template/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
skip_covered = false
show_missing = true
precision = 2
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "tmp/htmlcov"

[tool.coverage.xml]
output = "tmp/coverage.xml"

[tool.vulture]
min_confidence = 80
paths = ["src", "tests", "tools"]
exclude = [
    "*/tests/*",      # Test fixtures often appear unused
    "*/__pycache__/*",
]
ignore_names = [
    # Imported under `if TYPE_CHECKING:` and referenced only from string
    # annotations (e.g. `console: "ConsoleType"`), which vulture does not
    # parse. Deleting these imports would break type checking.
    "ConsoleType",
    # Click passes options by keyword; `state backend migrate` accepts --from/--to
    # but is not implemented yet (src/infrafoundry/cli/commands/state/backend.py).
    "from_backend",
    "to_backend",
    # Parameters of abstract methods in the provider plugin contract
    # (src/infrafoundry/providers/protocol.py); implementers and callers rely on
    # the names, so they cannot be `_`-prefixed.
    "resource_config",
    "desired_config",
    "test_*",         # Pytest test functions
    "fixture_*",      # Pytest fixtures
    "*_fixture",      # Pytest fixtures
    "setUp",          # unittest methods
    "tearDown",       # unittest methods
    "setUpClass",     # unittest methods
    "tearDownClass",  # unittest methods
]
ignore_decorators = [
    "@pytest.fixture",
    "@pytest.mark.*",
    "@click.command",
    "@click.option",
    "@click.group",
    "@abstractmethod",
]

[tool.mutmut]
source_paths = ["src/"]
# The tests that exercise src/, not all of tests/. mutmut runs them inside
# mutants/, a copy holding src/, tests/ and the project files but not tools/ or
# the rest of the repository. One test there that imports tools or reads a repo
# file stops the stats run, and no mutant gets checked (pyproject-template #873).
# tests/test_mutmut_config.py fails when a test that imports the package is
# missing from this list.
pytest_add_cli_args_test_selection = [
    "tests/unit/cli/",
    "tests/unit/core/",
    "tests/unit/providers/",
    "tests/unit/secrets/",
    "tests/unit/test_aiqum_blueprint.py",
