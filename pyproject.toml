[project]
name = "infrafoundry"
description = "Infrastructure automation framework with pluggable providers (Proxmox, OPNsense, Kubernetes)"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "click>=8.1.0",
    "doit>=0.36.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "ansible>=2.15.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "opnsense-openapi>=0.1.0",
    "pyinfra>=3.5.1",
    "boto3>=1.34.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "codespell>=2.2",
    "commitizen>=3.0",
    "coverage-badge>=1.1.0",
    "mkdocs-material>=9.5",
    "mypy>=1.0.0",
    "pre-commit>=3.7.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyproject-fmt>=2.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.32.0",
    "types-boto3>=1.35.0",
]
security = [
    "pip-audit>=2.6",
    "bandit>=1.7",
    "pip-licenses>=4.0",
]

[project.scripts]
foundry = "infrafoundry.cli:foundry"

[project.entry-points."infrafoundry.plugin_types"]
provider = "infrafoundry.providers.plugin_type:ProviderPluginType"
secret_backend = "infrafoundry.secrets.plugin_type:SecretBackendPluginType"

[project.entry-points."infrafoundry.secrets"]
env = "infrafoundry.secrets.backends.env:register"
file = "infrafoundry.secrets.backends.file:register"

[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infrafoundry"]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?:v|d)(?P<version>.+)$"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/infrafoundry/_version.py"

[tool.ruff]
cache-dir = "tmp/.ruff_cache"
line-length = 100
target-version = "py312"
extend-exclude = ["**/_version.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) - allow for now, fix incrementally
    "ANN001",  # Missing type annotation for function argument - fix incrementally
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "B024",    # Abstract base class without abstract methods - intentional in some cases
    "B904",    # raise-without-from - fix incrementally
    "RUF012",  # Mutable class default - fix incrementally
    "E402",    # Module level import not at top of file - needed for CLI command loading
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
cache_dir = "tmp/.mypy_cache"
python_version = "3.12"
# Strict type checking
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
# Additional strict checks
check_untyped_defs = true
disallow_any_generics = false  # Can enable later for even stricter checking
disallow_incomplete_defs = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "7.0"
cache_dir = "tmp/.pytest_cache"
addopts = "-v --tb=short --strict-config --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full workflows",
    "slow: Tests that take significant time to run",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "v$version"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true
# Merge pre-release entries into final release in CHANGELOG
merge_prerelease = true
# Commit types that trigger version bumps
bump_pattern = "^(feat|fix|refactor|perf)"
bump_map = { "feat" = "MINOR", "fix" = "PATCH", "refactor" = "PATCH", "perf" = "PATCH" }
# BREAKING CHANGE in commit message triggers MAJOR bump
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]

[tool.bandit]
exclude_dirs = ["tests", "tmp", ".venv"]
skips = ["B101"]  # Skip assert_used - asserts are fine in tests

[tool.codespell]
skip = "tmp,.venv,.git,*.lock,*.pyc,__pycache__"
ignore-words-list = "crate,applyable"

[tool.coverage.run]
branch = true
data_file = "tmp/.coverage"
source = ["src/infrafoundry"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
skip_covered = false
show_missing = true
precision = 2
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "tmp/htmlcov"

[tool.coverage.xml]
output = "tmp/coverage.xml"
