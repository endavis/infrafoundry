default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: true
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py
      - id: tests
        name: tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py

      # Branch naming enforcement
      - id: check-branch-name
        name: Check branch naming convention
        entry: >
          bash -c '
          BRANCH=$(git branch --show-current);
          if [[ "$BRANCH" != "main" && "$BRANCH" != "develop" &&
                ! "$BRANCH" =~ ^(issue|feat|fix|hotfix|docs)/[0-9]+-[a-z0-9\-]+$ &&
                ! "$BRANCH" =~ ^(docs|release)/.+ ]]; then
            echo "❌ Branch name must follow convention:";
            echo "   - issue/<num>-<description>";
            echo "   - feat/<num>-<description>";
            echo "   - fix/<num>-<description>";
            echo "   - hotfix/<description>";
            echo "   - docs/<description>";
            echo "   - release/<version>";
            echo "";
            echo "Current branch: $BRANCH";
            exit 1;
          fi
          '
        language: system
        pass_filenames: false
        always_run: true

  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

