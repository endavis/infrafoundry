default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # Ruff - Python linter and formatter (official repo)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '(\.cache/|dodo\.py)'
      - id: ruff-format
        exclude: '(\.cache/|dodo\.py)'

  # Mypy - Type checking (official mirror)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - types-boto3
        exclude: '(\.cache/|dodo\.py)'

  # Bandit - Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  # Codespell - Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: [--toml, pyproject.toml]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      # Branch naming enforcement
      - id: check-branch-name
        name: Check branch naming convention
        entry: >
          bash -c '
          BRANCH=$(git branch --show-current);
          if [[ "$BRANCH" != "main" && "$BRANCH" != "develop" &&
                ! "$BRANCH" =~ ^(issue|feat|fix|hotfix|docs)/[0-9]+-[a-z0-9\-]+$ &&
                ! "$BRANCH" =~ ^(docs|release)/.+ ]]; then
            echo "❌ Branch name must follow convention:";
            echo "   - issue/<num>-<description>";
            echo "   - feat/<num>-<description>";
            echo "   - fix/<num>-<description>";
            echo "   - hotfix/<description>";
            echo "   - docs/<description>";
            echo "   - release/<version>";
            echo "";
            echo "Current branch: $BRANCH";
            exit 1;
          fi
          '
        language: system
        pass_filenames: false
        always_run: true

      # Run tests (using uv since it's environment-specific)
      - id: tests
        name: tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
        exclude: '(\.cache/|dodo\.py)'
