default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: true
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py
      - id: tests
        name: tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
        exclude: '(\.cache/|dodo\.py)' # Exclude cache directory and dodo.py

